[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-credit"
version = "0.1.0"
description = "Autonomous US high-yield credit analyst"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "jinja2>=3.1",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter",
]

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
