name: sentinel-daily
on:
  schedule:
    - cron: "17 6 * * 1-5"   # 06:17 UTC weekdays, after overnight EDGAR filings
  workflow_dispatch:
    inputs:
      no_llm:
        description: "Skip LLM steps (rules-only run)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: sentinel, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SENTINEL_LLM_PROVIDER: ${{ vars.SENTINEL_LLM_PROVIDER || 'deepseek' }}
      SENTINEL_MODEL: ${{ vars.SENTINEL_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run agents
        run: python -m sentinel.pipeline --universe universe/us_hy.csv ${{ inputs.no_llm && '--no-llm' || '' }}
      - name: Build site
        run: python -m sentinel.site.build
      - name: Commit data and ledger
        run: |
          git config user.name "sentinel-bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          git add data ledger
          git diff --cached --quiet || git commit -m "sentinel run $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
